# sample config for ngx_http_ja4_module
worker_processes  auto;

events {
    worker_connections  1024;
}

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 1024;

brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/wasm
    font/woff2;s

http {
    # debug variables $ssl_ja4_r / $ssl_ja4_o require this directive
    # (default off).  Uncomment to expose them in logs / responses.
    # ja4_debug_enable on;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" ja4=$ssl_ja4 ja4s=$ssl_ja4s ja4h=$http_ja4h';

    # debug log format: also records raw JA4 variants (needs
    # ja4_debug_enable on; above)
    log_format  main_debug  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" ja4=$ssl_ja4 ja4s=$ssl_ja4s '
                            'ja4h=$http_ja4h ja4r=$ssl_ja4_r ja4o=$ssl_ja4_o';

    access_log  logs/access.log  main;

    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      server.crt;
        ssl_certificate_key  server.key;

        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        location / {
            root   html;
            index  index.html;
        }

        # echo the fingerprint (JA4 / JA4S / JA4H)
        location = /ja4 {
            default_type text/plain;
            return 200 "$ssl_ja4\n$ssl_ja4s\n$http_ja4h\n";
        }

        # echo debug raw variants (needs ja4_debug_enable on; above)
        location = /ja4debug {
            default_type text/plain;
            return 200 "$ssl_ja4_r\n$ssl_ja4_o\n";
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-JA4 $ssl_ja4;
            proxy_set_header X-JA4H "ja4h_$http_ja4h";

            add_header X-JA4  $ssl_ja4 always;
            add_header X-JA4H "ja4h_$http_ja4h" always;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 3s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

stream {
    ja4_stream_enable on;
    ja4_stream_debug_enable on;
    log_format stream_main
        '$remote_addr [$time_local] '
        '$protocol $status '
        'bytes_sent=$bytes_sent bytes_received=$bytes_received '
        'session_time=$session_time '
        'server_name=$server_name '
        'upstream=$upstream_addr '
        'upstream_connect_time=$upstream_connect_time '
        'ja4=$ssl_ja4 ja4s=$ssl_ja4s';

    access_log /var/log/nginx/stream-access.log stream_main;

    server {
        listen 51821 ssl;
        ssl_certificate      server.crt;
        ssl_certificate_key  server.key; 
        proxy_pass 8.215.63.96:51821;

        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
